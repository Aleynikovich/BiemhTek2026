# BiemhTek2026 KUKA Robot Application Configuration

# Vision Server
vision.server.ip=172.31.1.69
vision.server.port=59002

# Vision References
vision.references=BIEMH26_105053,BIEMH26_105055,BIEMH26_105060
vision.reference.count=3
vision.zone=1

# Console Server
console.server.port=30001

# Motion Parameters
motion.joint.velocity=0.25
motion.delay.ms=500
motion.delay.minor.ms=200

# Impedance Control Parameters (for compliance and safety)
# Cartesian stiffness values [N/m for translation, Nm/rad for rotation]
# Lower values = more compliant, Higher values = more rigid
# Translation stiffness (X, Y, Z) - range: 0-5000 N/m
impedance.stiffness.x=2000
impedance.stiffness.y=2000
impedance.stiffness.z=1500
# Rotational stiffness (A, B, C) - range: 0-300 Nm/rad
impedance.stiffness.a=200
impedance.stiffness.b=200
impedance.stiffness.c=200
# Damping values for all axes (dimensionless) - range: 0.1-1.0
impedance.damping=0.7
# Enable/disable impedance control
impedance.enabled=true

# Calibration
calibration.points.count=16
calibration.points.root=/CalibrationPoints

# Pre-pick offset (mm above workpiece for approach)
pick.prepick.offset.z=200

# Workpiece Queue Settings
# Position tolerance for matching workpieces (mm)
workpiece.position.tolerance.mm=5.0

# SmartPicking Thread Settings
# Initial retry delay when connection fails (ms)
vision.retry.initial.delay.ms=1000
# Maximum retry delay (ms)
vision.retry.max.delay.ms=60000
# Backoff multiplier for exponential backoff
vision.retry.backoff.multiplier=2.0
# Connection health check interval (ms)
vision.connection.check.interval.ms=5000
# Maximum consecutive errors before shutdown
vision.max.consecutive.errors=10

# Motion Strategy Settings
# Redundancy E1 offsets to try (degrees, comma-separated)
motion.redundancy.offsets=-80,80,-60,60
# Z-axis rotation angles for place operations (degrees, comma-separated)
motion.place.z.rotations=90,45,0,135,180,-45,-90,-135
