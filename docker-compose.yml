version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:14-alpine
    container_name: robot-config-db
    environment:
      POSTGRES_DB: robot_config
      POSTGRES_USER: robot
      POSTGRES_PASSWORD: robot123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U robot"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - robot-network

  # Config Service
  config-service:
    build:
      context: ./config-service
      dockerfile: Dockerfile
    container_name: robot-config-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/robot_config
      POSTGRES_USER: robot
      POSTGRES_PASSWORD: robot123
      SERVER_PORT: 8080
      LOG_LEVEL: INFO
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - robot-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  robot-network:
    driver: bridge
