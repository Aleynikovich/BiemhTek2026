# Program ID to Factory Class Mapping
# This file configures which factory class should be used for each program ID.
# Format: programId=fully.qualified.FactoryClassName
#
# To add a new program:
# 1. Create a new factory class that implements biemhTekniker.programs.ProgramFactory
# 2. Add a mapping here with the program ID and factory class name
# 3. No code changes needed in Main.java
#
# Program IDs:
# 1 = Get New Workpiece Position (from vision system)
# 2 = Calibration (hand-eye calibration)
# 4 = Pick New Workpiece
# 5 = Place New Workpiece
# 6 = Pick Measured Workpiece
# 7 = Place Measured Workpiece

1=biemhTekniker.factories.GetNewWorkpieceFactory
2=biemhTekniker.factories.CalibrationFactory
4=biemhTekniker.factories.PickNewWorkpieceFactory
5=biemhTekniker.factories.PlaceNewWorkpieceFactory
6=biemhTekniker.factories.PickMeasuredWorkpieceFactory
7=biemhTekniker.factories.PlaceMeasuredWorkpieceFactory
